format: gemproblem/v0.2
problem:
  id: constrained_product_q90_growth
  title: Product Maximization in the Top-Decile Growth Region
  objectives:
    - name: product_flux
      source: exact_metric
      metric: product_flux
      direction: maximize
      normalization: {method: frozen_minmax}
  constraints:
    - name: high_growth_region
      source: exact_metric
      metric: maximum_growth
      operator: ">="
      reference:
        source: frozen_landscape
        statistic: q90
        multiplier: 1.0
      freeze_before_live_search: true
